services:
  db:
    image: postgres:16-alpine
    container_name: shopping_list_db
    restart: always
    env_file:
      - ./backend/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-shopping_list}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    container_name: shopping_list_api
    build:
      context: ./backend
      dockerfile: Dockerfile.local
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8001:8000"
    env_file:
      - ./backend/.env
    restart: always
    environment:
      POSTGRES_SERVER: db
      TZ: America/Bogota
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    image: node:22-alpine
    container_name: shopping_list_ui
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      api:
        condition: service_started
    ports:
      - "5175:5173"
    restart: always
    environment:
      - NODE_ENV=development

volumes:
  postgres_data:
  frontend_node_modules:
